      document.getElementById('habitDetailStats').textContent = `🔥 Seri: ${calculateStreak(hist)} Gün`;

      const grid = document.getElementById('habitCalendar');
      grid.innerHTML = '';
      ['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].forEach(d => {
        const c = document.createElement('div');
        c.style.cssText = 'text-align:center; font-size:10px; color:var(--muted);';
        c.textContent = d; grid.appendChild(c);
      });

      const y = selectedHabitMonth.getFullYear(), m = selectedHabitMonth.getMonth();
      let start = new Date(y, m, 1).getDay(); start = (start === 0) ? 6 : start - 1;
      const days = new Date(y, m+1, 0).getDate();
      const todayK = dayKey(new Date());
      for(let i=0; i<start; i++) grid.appendChild(document.createElement('div'));
      for(let d=1; d<=days; d++){
        const k = dayKey(new Date(y, m, d));
        const cell = document.createElement('div');
        cell.className = 'habit-cal-cell' + (hist.includes(k) ? ' done' : '') + (k === todayK ? ' today' : '');
        cell.textContent = d;
        cell.style.cursor = 'pointer';
        cell.onclick = () => toggleHabitForDate(selectedHabitId, k, true);
        grid.appendChild(cell);
      }
    }

    /* FIX: window.prompt standalone PWA'da (özellikle iOS) engellenebiliyor.
       Zaten dosyada duran ama hiç kullanılmayan dialogInput'a bağlandı. */
    function addNewHabit(){
      customPrompt('Yeni Alışkanlık', 'Alışkanlık adı', '', {}, (name) => {
        if(!name || !name.trim()) return;
        db.habits = db.habits || [];
        db.habits.push({ id: uid(), name: name.trim(), color: '#7dd3fc', order: db.habits.length });
        saveDB(); renderCurrentPage();
      });
    }

    function deleteHabit(id){
      const h = (db.habits || []).find(x => x.id === id);
      customConfirm('Sil', `"${h ? h.name : ''}" silinsin mi?`, () => {
        db.habits = (db.habits || []).filter(x => x.id !== id);
        if(db.habitHistory && db.habitHistory[id]) delete db.habitHistory[id];
        db.habits.forEach((x, i) => x.order = i);
        saveDB(); renderCurrentPage();
      });
    }

    function setHabitColor(id, color){
      const h = (db.habits || []).find(x => x.id === id);
      if(!h) return;
      h.color = color;
      saveDB(); renderCurrentPage();
    }

    /* FIX: sıralama görünürde order'a göreydi ama takas ham dizi indeksinde yapılıyordu;
       order'lar karışınca yanlış satır yer değiştiriyordu. Sıralı liste üzerinden takas. */
    function moveHabit(id, dir){
      const sorted = [...(db.habits || [])].sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
      const idx = sorted.findIndex(h => h.id === id);
      const target = idx + dir;
      if(idx === -1 || target < 0 || target >= sorted.length) return;
      const tmp = sorted[idx]; sorted[idx] = sorted[target]; sorted[target] = tmp;
      sorted.forEach((h, i) => h.order = i);
      db.habits = sorted;
      saveDB(); renderCurrentPage();
    }

    /* ================= RUTİN TABLOSU =================
       Veri masaüstü sürümüyle ortak:
       routine.template / routine.weeks[haftaKey] -> { "gun-saat": {t,c,rs,cs,cov,hb} }
       routine.done -> { "YYYY-AA-GG|saat": true }
    ================================================== */
    const DOW_SHORT = ['Pzt','Sal','Çar','Per','Cum','Cts','Paz'];
    const DOW_LONG  = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
    const RT_SWATCHES = ['#7dd3fc','#34d399','#fbbf24','#fb7185','#a78bfa','#f472b6','#38bdf8','#94a3b8'];
    let rtView = 'week';          // 'week' | 'tpl'
    let rtEdit = null;            // { dow, hour, span, color, text, hb }
    let rtScrollToNow = false;    // sayfaya girildiğinde şu anki saate kaydır
    let rtShowTasks = (lsGet('rt_show_tasks') !== '0');   // o günün görevleri de listede görünsün mü

    function R(){ if(!db.routine) db.routine = emptyRoutine(); return db.routine; }
    function rtHours(){ const c = R().cfg; return { start:c.start, end:c.end, n:Math.max(1, c.end - c.start) }; }
    function ck(dow, hour){ return dow + '-' + hour; }
    function startOfWeek(date){
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return d;
    }
    function addDays(date, n){ return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n); }
    function rtWeekKey(){ return dayKey(startOfWeek(selectedDate)); }

    function rtCells(){
      if(rtView === 'tpl') return R().template;
      return R().weeks[rtWeekKey()] || R().template;
    }
    function rtIsGhost(){ return rtView === 'week' && !R().weeks[rtWeekKey()]; }
    /* Şablona dokunmadan bu haftaya özel kopya oluşturur (masaüstündeki mantığın aynısı) */
    function rtEditable(){
      if(rtView === 'tpl') return R().template;
      const wk = rtWeekKey();
      if(!R().weeks[wk]) R().weeks[wk] = JSON.parse(JSON.stringify(R().template));
      return R().weeks[wk];
    }
    function cleanCell(cells, dow, hour){
      const k = ck(dow, hour), c = cells[k];
      if(!c) return;
      if(!c.t && !c.c && !c.hb && !c.cov && (!c.rs || c.rs === 1) && (!c.cs || c.cs === 1)) delete cells[k];
    }
    function solidMix(hex, alpha){
      const h = String(hex||'').replace('#','');
      const f = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
      if(f.length < 6) return 'var(--card)';
      const rgb = [0,2,4].map(i => parseInt(f.slice(i,i+2),16));
      if(rgb.some(isNaN)) return 'var(--card)';
      const base = [23,23,26];
      return `rgb(${rgb.map((v,i)=>Math.round(v*alpha + base[i]*(1-alpha))).join(',')})`;
    }

    /* Masaüstünde birleştirilmiş (rs/cs) hücreler mobilde de doğru görünsün diye:
       bir saatin hangi "baş" hücreye ait olduğunu bulur. */
    function resolveHead(cells, dow, hour){
      const direct = cells[ck(dow, hour)];
      if(direct && !direct.cov) return { cell: direct, dow, hour };
      const H = rtHours();
      for(let d = 0; d <= dow; d++){
        for(let h = H.start; h <= hour; h++){
          const c = cells[ck(d, h)];
          if(!c || c.cov) continue;
          const rs = c.rs || 1, cs = c.cs || 1;
          if(dow < d + cs && hour < h + rs) return { cell: c, dow: d, hour: h };
        }
      }
      return null;
    }

    function rtDoneKey(dateK, hour){ return dateK + '|' + hour; }
    function setHabitDate(habitId, dateK, on){
      if(!Array.isArray(db.habitHistory[habitId])) db.habitHistory[habitId] = [];
      const has = db.habitHistory[habitId].includes(dateK);
      if(on && !has) db.habitHistory[habitId].push(dateK);
      if(!on && has) db.habitHistory[habitId] = db.habitHistory[habitId].filter(x => x !== dateK);
    }

    function renderRoutine(){
      const H = rtHours();
      const cells = rtCells();
      const ghost = rtIsGhost();
      const dow = (selectedDate.getDay() + 6) % 7;
      const dateK = dayKey(selectedDate);
      const weekStart = startOfWeek(selectedDate);
      const todayK = dayKey(new Date());
      const now = new Date();

      /* --- gün başlığı (üstte sabit kalır) --- */
      const sticky = document.createElement('div');
      sticky.className = 'rt-sticky';
      const header = document.createElement('div');
      header.className = 'daily-header';
      header.innerHTML = `
        <button class="arrow-btn" type="button">❮</button>
        <div class="date-display">
          <div class="date-big">${esc(DOW_LONG[dow])}</div>
          <div class="date-small">${esc(selectedDate.toLocaleDateString('tr-TR', {day:'numeric', month:'long'}))}</div>
        </div>
        <button class="arrow-btn" type="button">❯</button>
      `;
      header.children[0].onclick = () => changeDay(-1);
      header.children[2].onclick = () => changeDay(1);
      sticky.appendChild(header);

      /* --- araç çubuğu --- */
      const bar = document.createElement('div');
      bar.className = 'rt-toolbar';

      const seg = document.createElement('div'); seg.className = 'seg';
      const bWeek = document.createElement('button'); bWeek.type='button'; bWeek.textContent='Bu hafta';
      const bTpl  = document.createElement('button'); bTpl.type='button';  bTpl.textContent='Şablon';
      (rtView === 'week' ? bWeek : bTpl).classList.add('active');
      bWeek.onclick = () => { rtView = 'week'; renderCurrentPage(); };
      bTpl.onclick  = () => { rtView = 'tpl';  renderCurrentPage(); };
      seg.appendChild(bWeek); seg.appendChild(bTpl);
      bar.appendChild(seg);

      if(ghost){
        const g = document.createElement('span'); g.className = 'ghost-badge'; g.textContent = 'şablon';
        g.title = 'Bu hafta için henüz özel düzen yok';
        bar.appendChild(g);
      }

      const mk = (label, fn) => {
        const b = document.createElement('button');
        b.type='button'; b.className='rt-mini-btn'; b.textContent=label; b.onclick=fn;
        return b;
      };
      bar.appendChild(mk('🎨 Gün', () => openDayTheme(dow)));
      if(rtView === 'week'){
        const tb = mk(rtShowTasks ? '📋 Görevler açık' : '📋 Görevler kapalı', () => {
          rtShowTasks = !rtShowTasks;
          lsSet('rt_show_tasks', rtShowTasks ? '1' : '0');
          renderCurrentPage();
        });
        if(rtShowTasks){ tb.style.color = 'var(--accent)'; tb.style.borderColor = '#7dd3fc55'; }
        bar.appendChild(tb);
      }
      if(rtView === 'week'){
        bar.appendChild(mk('⇪ Şablona yaz', () => {
          customConfirm('Şablon', 'Bu haftanın düzeni şablona yazılsın mı?', () => {
            R().template = JSON.parse(JSON.stringify(rtCells()));
            delete R().weeks[rtWeekKey()];
            saveDB(); renderCurrentPage();
          });
        }));
        if(!ghost) bar.appendChild(mk('↺ Şablona dön', () => {
          customConfirm('Sıfırla', 'Bu haftaya özel değişiklikler silinsin mi?', () => {
            delete R().weeks[rtWeekKey()];
            saveDB(); renderCurrentPage();
          });
        }));
      }
      sticky.appendChild(bar);

      /* --- haftalık genel bakış şeridi (yazısız, sadece renk) --- */
      const strip = document.createElement('div'); strip.className = 'week-strip';
      for(let d = 0; d < 7; d++){
        const dd = addDays(weekStart, d), dk = dayKey(dd);
        const col = document.createElement('div');
        col.className = 'ws-col' + (d === dow ? ' sel' : '') + (dk === todayK ? ' today' : '');
        const th = R().dayThemes[d];

        const nm = document.createElement('div'); nm.className = 'ws-name'; nm.textContent = DOW_SHORT[d];
        if(th && th.color) nm.style.color = th.color;
        col.appendChild(nm);
        if(rtView === 'week'){
          const dt = document.createElement('div'); dt.className = 'ws-date'; dt.textContent = dd.getDate();
          col.appendChild(dt);
        }

        const bars = document.createElement('div'); bars.className = 'ws-bars';
        /* o günün görevlerini saatlere göre işaretle (şerit sadece rutini göstermesin) */
        const taskHours = {};
        if(rtShowTasks && rtView === 'week'){
          (db.days[dk] || []).forEach(t => {
            const m = /^(\d{1,2}):(\d{2})$/.exec(t.time || '');
            if(m) taskHours[Number(m[1])] = t.done ? 'done' : (t.type || 'gorev');
          });
        }
        for(let h = H.start; h < H.end; h++){
          const bar1 = document.createElement('div'); bar1.className = 'ws-bar';
          const head = resolveHead(cells, d, h);
          if(head && head.cell && (head.cell.t || head.cell.c)){
            bar1.style.background = head.cell.c || '#3f3f46';
            if(rtView === 'week' && R().done[rtDoneKey(dk, h)]) bar1.style.opacity = '.35';
          }
          const tk = taskHours[h];
          if(tk){
            const col = tk === 'termin' ? 'var(--frame-termin)'
                      : tk === 'hedef' ? 'var(--frame-hedef)'
                      : tk === 'done' ? '#3f3f46' : 'var(--frame-gorev)';
            bar1.style.boxShadow = 'inset 3px 0 0 ' + col;
          }
          bars.appendChild(bar1);
        }
        col.appendChild(bars);
        col.onclick = () => { selectedDate = dd; renderCurrentPage(); };
        strip.appendChild(col);
      }
      sticky.appendChild(strip);
      pageContainer.appendChild(sticky);

      /* --- seçili günün saat listesi --- */
      const theme = R().dayThemes[dow];
      if(theme && theme.name){
        const t = document.createElement('div');
        t.style.cssText = `font-size:12px; color:${theme.color}; margin-bottom:10px; font-weight:600;`;
        t.textContent = theme.name;
        pageContainer.appendChild(t);
      }

      /* --- o günün görev/terminlerini saatlere dağıt --- */
      /* Şablon görünümünde gerçek bir tarih yok, o yüzden sadece hafta görünümünde. */
      const showTasks = rtShowTasks && rtView === 'week';
      const byHour = {};      // saat -> [görev]
      const looseTasks = [];  // saati olmayan veya tablo aralığı dışında kalanlar
      if(showTasks){
        sortTasks(db.days[dateK] || []).forEach(t => {
          const m = /^(\d{1,2}):(\d{2})$/.exec(t.time || '');
          if(!m){ looseTasks.push(t); return; }
          const hh = Number(m[1]);
          if(hh < H.start || hh >= H.end){ looseTasks.push(t); return; }
          (byHour[hh] = byHour[hh] || []).push(t);
        });
      }

      function taskRow(t){
        const row = document.createElement('div'); row.className = 'rt-row';
        const lbl = document.createElement('div'); lbl.className = 'rt-hour sub';
        lbl.textContent = t.time || '';
        const el = document.createElement('div');
        el.className = 'rt-task' + (t.done ? ' done' : '');
        el.style.borderLeftColor = t.type === 'termin' ? 'var(--frame-termin)'
                                 : (t.type === 'hedef' ? 'var(--frame-hedef)' : 'var(--frame-gorev)');

        const circle = document.createElement('div');
        circle.className = 'check-circle' + (t.done ? ' checked' : '');
        circle.textContent = '✓';
        circle.onclick = (e) => { e.stopPropagation(); toggleTask(t.id, 'day', dateK); };

        const txt = document.createElement('div'); txt.className = 'rt-task-text';
        txt.textContent = t.text || '(başlıksız)';

        el.appendChild(circle); el.appendChild(txt);
        const tg = (db.tags || []).find(x => x.name === t.tag);
        if(tg){
          const s = document.createElement('span');
          s.className = 'rt-task-tag';
          s.style.color = tg.color; s.style.border = '1px solid ' + tg.color + '44';
          s.textContent = tg.name;
          el.appendChild(s);
        }
        el.onclick = () => openEditTask(t.id, 'day', dateK);
        row.appendChild(lbl); row.appendChild(el);
        return row;
      }
      /* bir bloğun kapsadığı saatlere düşen görevleri bloğun altına ekle */
      function appendTasks(fromH, toH){
        for(let hh = fromH; hh < toH; hh++){
          (byHour[hh] || []).forEach(t => pageContainer.appendChild(taskRow(t)));
        }
      }

      /* saatsiz / aralık dışı olanlar en üstte topluca */
      if(looseTasks.length){
        const lbl = document.createElement('div'); lbl.className = 'rt-loose-lbl';
        lbl.textContent = 'Saati yok / tablo aralığı dışında';
        pageContainer.appendChild(lbl);
        looseTasks.forEach(t => pageContainer.appendChild(taskRow(t)));
        const sep = document.createElement('div');
        sep.style.cssText = 'height:1px; background:var(--line); margin:10px 0;';
        pageContainer.appendChild(sep);
      }

      let h = H.start;
      let nowBlock = null;
      while(h < H.end){
        const head = resolveHead(cells, dow, h);

        /* --- boş saat --- */
        if(!head || !head.cell || (!head.cell.t && !head.cell.c)){
          /* FIX: burada onclick doğrudan h'yi kullanıyordu. h döngünün dışında tanımlı
             tek bir değişken olduğu için, tıklandığı anda değeri hep son saat (23)
             oluyordu -> her + aynı saati açıyordu. Satır başına kopya alınıyor. */
          const hourAt = h;
          const row = document.createElement('div'); row.className = 'rt-row';
          const lbl = document.createElement('div'); lbl.className = 'rt-hour';
          lbl.textContent = String(hourAt).padStart(2,'0') + ':00';
          const blk = document.createElement('div');
          blk.className = 'rt-block empty';
          blk.textContent = '+';
          blk.onclick = () => openRtCell(dow, hourAt);
          row.appendChild(lbl); row.appendChild(blk);
          pageContainer.appendChild(row);
          appendTasks(hourAt, hourAt + 1);
          h++;
          continue;
        }

        const row = document.createElement('div'); row.className = 'rt-row';
        const lbl = document.createElement('div'); lbl.className = 'rt-hour';
        const cell = head.cell;
        const rs = cell.rs || 1;
        const from = Math.max(H.start, head.hour);
        const to = Math.min(H.end, head.hour + rs);   // dışlayıcı
        const span = to - from;

        lbl.innerHTML = String(from).padStart(2,'0') + ':00' +
          (span > 1 ? '<br>' + String(to).padStart(2,'0') + ':00' : '');

        const blk = document.createElement('div');
        blk.className = 'rt-block';
        blk.style.minHeight = (40 + (span - 1) * 26) + 'px';
        if(theme && theme.color) blk.style.background = solidMix(theme.color, .08);
        if(cell.c){
          blk.style.background = solidMix(cell.c, .30);
          blk.style.borderColor = cell.c + '66';
        }
        if(ghost) blk.classList.add('ghost');
        if(rtView === 'week' && dateK === todayK && now.getHours() >= from && now.getHours() < to){
          blk.classList.add('rt-now');
          nowBlock = row;
        }

        const isDone = rtView === 'week' && !!R().done[rtDoneKey(dateK, from)];
        if(isDone) blk.classList.add('done');

        if(rtView === 'week'){
          const circle = document.createElement('div');
          circle.className = 'check-circle' + (isDone ? ' checked' : '');
          circle.textContent = '✓';
          circle.onclick = (e) => { e.stopPropagation(); rtToggleDone(dateK, from, to, cell); };
          blk.appendChild(circle);
        }

        const txt = document.createElement('div'); txt.className = 'rt-text';
        txt.textContent = cell.t || '';
        blk.appendChild(txt);

        if(cell.hb){
          const hb = document.createElement('div'); hb.className = 'rt-hb'; hb.textContent = '◉';
          const hh = (db.habits||[]).find(x => x.id === cell.hb);
          hb.title = hh ? hh.name : '';
          blk.appendChild(hb);
        }

        blk.onclick = () => openRtCell(head.dow, head.hour);
        row.appendChild(lbl); row.appendChild(blk);
        pageContainer.appendChild(row);
        appendTasks(from, to);
        h = to;
      }

      const hint = document.createElement('div');
      hint.style.cssText = 'font-size:11px; color:#444; margin-top:16px; line-height:1.6;';
      hint.textContent = rtView === 'week'
        ? (ghost ? 'Şu an şablonu görüyorsun. İlk değişiklikte bu haftaya özel kopya oluşur, şablonun bozulmaz.'
                 : 'Bu haftaya özel düzen. Sağa/sola kaydırarak gün değiştir.')
        : 'Şablon her hafta tekrar eder.';
      pageContainer.appendChild(hint);

      /* sayfaya ilk girişte doğrudan şu anki saate in */
      if(rtScrollToNow){
        rtScrollToNow = false;
        if(nowBlock) setTimeout(() => {
          pageContainer.scrollTop = Math.max(0, nowBlock.offsetTop - pageContainer.offsetTop - 120);
        }, 0);
      }
    }

    function rtToggleDone(dateK, from, to, cell){
      const on = !R().done[rtDoneKey(dateK, from)];
      for(let h = from; h < to; h++){
        if(on) R().done[rtDoneKey(dateK, h)] = true;
        else delete R().done[rtDoneKey(dateK, h)];
      }
      /* hücre bir alışkanlığa bağlıysa o gün de işaretlensin */
      if(cell.hb && (db.habits||[]).some(x => x.id === cell.hb)) setHabitDate(cell.hb, dateK, on);
      saveDB(); renderCurrentPage();
    }

    /* --- hücre düzenleme sayfası --- */
    const rtModal = document.getElementById('rtModal');
    function openRtCell(dow, hour){
      const cells = rtCells();
      const existing = cells[ck(dow, hour)];
      const cur = (existing && !existing.cov) ? existing : {};
      const H = rtHours();

      rtEdit = {
        dow, hour,
        text: cur.t || '',
        color: cur.c || '',
        hb: cur.hb || '',
        span: Math.min(cur.rs || 1, H.end - hour),
        cs: cur.cs || 1
      };

      document.getElementById('rtModalTitle').textContent =
        DOW_LONG[dow] + ' · ' + String(hour).padStart(2,'0') + ':00';
      document.getElementById('rtModalWhere').textContent =
        rtView === 'tpl' ? 'Şablon — her hafta tekrar eder'
                         : (rtIsGhost() ? 'Kaydedince bu haftaya özel kopya oluşur' : 'Bu haftaya özel');

      document.getElementById('rtText').value = rtEdit.text;

      /* süre seçenekleri */
      const spanSel = document.getElementById('rtSpan');
      spanSel.innerHTML = '';
      const maxSpan = H.end - hour;
      for(let i = 1; i <= maxSpan; i++){
        const o = document.createElement('option');
        o.value = i; o.textContent = i + ' saat';
        spanSel.appendChild(o);
      }
      spanSel.value = rtEdit.span;

      /* alışkanlık seçenekleri */
      const hbSel = document.getElementById('rtHabit');
      hbSel.innerHTML = '';
      const none = document.createElement('option'); none.value=''; none.textContent='Yok';
      hbSel.appendChild(none);
      (db.habits||[]).forEach(x => {
        const o = document.createElement('option'); o.value = x.id; o.textContent = x.name;
        hbSel.appendChild(o);
      });
      hbSel.value = rtEdit.hb;

      /* renkler */
      const sw = document.getElementById('rtSwatches');
      sw.innerHTML = '';
      const noneSw = document.createElement('div');
      noneSw.className = 'sw none' + (rtEdit.color ? '' : ' sel');
      noneSw.onclick = () => { rtEdit.color = ''; openRtSwatchRefresh(); };
      sw.appendChild(noneSw);
      RT_SWATCHES.forEach(c => {
        const d = document.createElement('div');
        d.className = 'sw' + (rtEdit.color === c ? ' sel' : '');
        d.style.background = c;
        d.onclick = () => { rtEdit.color = c; openRtSwatchRefresh(); };
        sw.appendChild(d);
      });

      document.getElementById('rtDelete').style.display = (cur.t || cur.c || cur.hb) ? 'block' : 'none';
      rtModal.style.display = 'flex';
      setTimeout(() => document.getElementById('rtText').focus(), 50);
    }
    function openRtSwatchRefresh(){
      const sw = document.getElementById('rtSwatches');
      [...sw.children].forEach((el, i) => {
        const c = i === 0 ? '' : RT_SWATCHES[i-1];
        el.classList.toggle('sel', rtEdit.color === c);
      });
    }
    function closeRtModal(){ rtModal.style.display = 'none'; rtEdit = null; applyPendingRemote(); }

    document.getElementById('rtCancel').onclick = closeRtModal;
    rtModal.onclick = (e) => { if(e.target === rtModal) closeRtModal(); };

    document.getElementById('rtSave').onclick = () => {
      if(!rtEdit) return;
      const cells = rtEditable();
      const H = rtHours();
      const { dow, hour } = rtEdit;
      const text = document.getElementById('rtText').value.trim();
      const span = Math.max(1, Math.min(Number(document.getElementById('rtSpan').value) || 1, H.end - hour));
      const hb = document.getElementById('rtHabit').value;
      const cs = rtEdit.cs || 1;

      /* hedef aralığı temizle: eski kapsamayı çöz, üstüne binen blokları kırp */
      rtClearRange(cells, dow, hour, span, cs);

      const cell = {};
      if(text) cell.t = text;
      if(rtEdit.color) cell.c = rtEdit.color;
      if(hb) cell.hb = hb;
      if(span > 1) cell.rs = span;
      if(cs > 1) cell.cs = cs;

      if(Object.keys(cell).length){
        cells[ck(dow, hour)] = cell;
        for(let d = dow; d < dow + cs; d++){
          for(let h = hour; h < hour + span; h++){
            if(d === dow && h === hour) continue;
            cells[ck(d, h)] = { cov: true };
          }
        }
      } else {
        delete cells[ck(dow, hour)];
      }

      saveDB(); closeRtModal(); renderCurrentPage();
    };

    document.getElementById('rtDelete').onclick = () => {
      if(!rtEdit) return;
      const cells = rtEditable();
      const { dow, hour } = rtEdit;
      const cur = cells[ck(dow, hour)] || {};
      rtClearRange(cells, dow, hour, cur.rs || 1, cur.cs || 1);
      delete cells[ck(dow, hour)];
      saveDB(); closeRtModal(); renderCurrentPage();
    };

    /* Verilen dikdörtgeni boşaltır; kısmen çakışan birleşik blokları da çözer,
       böylece ekranda "sahipsiz kapalı hücre" (delik) kalmaz. */
    function rtClearRange(cells, dow, hour, span, cs){
      const H = rtHours();
      for(let d = 0; d < 7; d++){
        for(let h = H.start; h < H.end; h++){
          const c = cells[ck(d, h)];
          if(!c || c.cov) continue;
          const rs2 = c.rs || 1, cs2 = c.cs || 1;
          const overlap = (d < dow + cs) && (dow < d + cs2) && (h < hour + span) && (hour < h + rs2);
          if(!overlap) continue;
          for(let dd = d; dd < d + cs2; dd++){
            for(let hh = h; hh < h + rs2; hh++){
              if(cells[ck(dd, hh)] && cells[ck(dd, hh)].cov) delete cells[ck(dd, hh)];
            }
          }
          delete c.rs; delete c.cs;
          if(d !== dow || h !== hour) cleanCell(cells, d, h);
        }
      }
      for(let d = dow; d < dow + cs; d++){
        for(let h = hour; h < hour + span; h++){
          if(d === dow && h === hour) continue;
          delete cells[ck(d, h)];
        }
      }
    }

    /* --- gün teması --- */
    function openDayTheme(dow){
      const t = R().dayThemes[dow] || {};
      customPrompt('Gün teması', DOW_LONG[dow] + ' için isim (boş = kaldır)', t.name || '', {}, (name) => {
        if(!name || !name.trim()){
          delete R().dayThemes[dow];
          saveDB(); renderCurrentPage(); return;
        }
        customPrompt('Renk', 'Bu gün için renk seç', t.color || '#7dd3fc', {type:'color'}, (color) => {
          R().dayThemes[dow] = { name: name.trim(), color: color || '#7dd3fc' };
          saveDB(); renderCurrentPage();
        });
      });
    }

    /* ================= AYARLAR ================= */
    function renderSettings(){
      const h2 = document.createElement('h2'); h2.textContent = 'Ayarlar';
      pageContainer.appendChild(h2);

      if(currentUser){
        const who = document.createElement('div');
        who.style.cssText = 'font-size:12px; color:var(--muted); margin-bottom:16px; overflow-wrap:anywhere;';
        who.textContent = currentUser.email || '';
        pageContainer.appendChild(who);
      } else {
        const who = document.createElement('div');
        who.style.cssText = 'font-size:12px; color:#fb7185; margin-bottom:16px;';
        who.textContent = 'Çevrimdışı mod — veriler sadece bu cihazda.';
        pageContainer.appendChild(who);
      }

      const wrap = document.createElement('div');
      wrap.style.marginBottom = '20px';
      const lbl = document.createElement('p');
      lbl.style.cssText = 'font-size:13px; color:var(--muted);';
      lbl.textContent = 'Etiket Yönetimi';
      wrap.appendChild(lbl);

      const row = document.createElement('div');
      row.style.cssText = 'display:flex; gap:8px; margin-bottom:12px;';
      const nameIn = document.createElement('input');
      nameIn.type = 'text'; nameIn.placeholder = 'Tag adı'; nameIn.maxLength = 30;
      nameIn.style.cssText = 'flex:1; padding:8px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; min-width:0;';
      const colIn = document.createElement('input');
      colIn.type = 'color'; colIn.value = '#7dd3fc';
      colIn.style.cssText = 'width:40px; height:36px; background:none; border:none;';
      const addBtn = document.createElement('button');
      addBtn.className = 'btn btn-primary'; addBtn.type = 'button'; addBtn.textContent = 'Ekle';
      const doAdd = () => {
        const n = nameIn.value.trim().toLowerCase();
        if(!n) return;
        if((db.tags || []).some(t => t.name === n)){ customAlert('Zaten var', `"${n}" etiketi zaten kayıtlı.`); return; }
        db.tags.push({ name: n, color: colIn.value });
        nameIn.value = '';
        saveDB(); renderCurrentPage();
      };
      addBtn.onclick = doAdd;
      nameIn.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); doAdd(); } };
      row.appendChild(nameIn); row.appendChild(colIn); row.appendChild(addBtn);
      wrap.appendChild(row);

      (db.tags || []).forEach((t, i) => {
        const div = document.createElement('div'); div.className = 'tag-row';

        const ctrl = document.createElement('div');
        ctrl.style.cssText = 'display:flex; flex-direction:column; gap:2px;';
        const up = document.createElement('div'); up.className = 'tag-ctrl-btn'; up.textContent = '▲';
        up.onclick = () => moveTag(i, -1);
        const dn = document.createElement('div'); dn.className = 'tag-ctrl-btn'; dn.textContent = '▼';
        dn.onclick = () => moveTag(i, 1);
        ctrl.appendChild(up); ctrl.appendChild(dn);

        const dot = document.createElement('div'); dot.className = 'color-dot'; dot.style.background = t.color;
        const colPick = document.createElement('input');
        colPick.type = 'color'; colPick.value = t.color || '#7dd3fc'; colPick.style.display = 'none';
        colPick.onchange = () => { t.color = colPick.value; saveDB(); renderCurrentPage(); };
        dot.style.cursor = 'pointer';
        dot.onclick = () => colPick.click();

        const nm = document.createElement('div'); nm.style.flex = '1'; nm.textContent = t.name;
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'icon-btn'; del.textContent = '🗑';
        del.onclick = () => removeTag(t.name);

        div.appendChild(ctrl); div.appendChild(dot); div.appendChild(colPick); div.appendChild(nm); div.appendChild(del);
        wrap.appendChild(div);
      });
      pageContainer.appendChild(wrap);

      /* --- rutin saat aralığı --- */
      const rWrap = document.createElement('div');
      rWrap.style.marginBottom = '20px';
      const rLbl = document.createElement('p');
      rLbl.style.cssText = 'font-size:13px; color:var(--muted);';
      rLbl.textContent = 'Rutin tablosu saat aralığı';
      rWrap.appendChild(rLbl);

      const rRow = document.createElement('div');
      rRow.style.cssText = 'display:flex; gap:8px; align-items:center;';
      const sIn = document.createElement('input');
      sIn.type = 'number'; sIn.min = 0; sIn.max = 23; sIn.value = R().cfg.start;
      sIn.style.cssText = 'flex:1; padding:8px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; min-width:0;';
      const dash = document.createElement('span'); dash.textContent = '–'; dash.style.color = 'var(--muted)';
      const eIn = document.createElement('input');
      eIn.type = 'number'; eIn.min = 1; eIn.max = 24; eIn.value = R().cfg.end;
      eIn.style.cssText = 'flex:1; padding:8px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; min-width:0;';
      const apply = document.createElement('button');
      apply.className = 'btn btn-primary'; apply.type = 'button'; apply.textContent = 'Uygula';
      apply.onclick = () => {
        const s = Math.max(0, Math.min(23, Number(sIn.value) || 7));
        const e = Math.max(s + 1, Math.min(24, Number(eIn.value) || 23));
        R().cfg = { start: s, end: e };
        saveDB(); renderCurrentPage();
      };
      rRow.appendChild(sIn); rRow.appendChild(dash); rRow.appendChild(eIn); rRow.appendChild(apply);
      rWrap.appendChild(rRow);
      pageContainer.appendChild(rWrap);

      const out = document.createElement('button');
      out.className = 'btn'; out.type = 'button';
      out.style.cssText = 'width:100%; border-color:#fb7185; color:#fb7185;';
      out.textContent = 'Çıkış Yap';
      out.onclick = logoutApp;
      pageContainer.appendChild(out);
    }

    function moveTag(index, dir){
      const t = index + dir;
      if(t < 0 || t >= db.tags.length) return;
      const tmp = db.tags[index]; db.tags[index] = db.tags[t]; db.tags[t] = tmp;
      saveDB(); renderCurrentPage();
    }
    /* FIX: etiket silinince kartlarda ölü etiket adı kalıyordu */
    function removeTag(name){
      customConfirm('Sil', `"${name}" silinsin mi?`, () => {
        db.tags = db.tags.filter(t => t.name !== name);
        for(const k in db.days) db.days[k].forEach(i => { if(i.tag === name) i.tag = ''; });
        (db.inbox || []).forEach(i => { if(i.tag === name) i.tag = ''; });
        if(!db.tags.length) db.tags = [{name:'genel', color:'#7dd3fc'}];
        saveDB(); renderCurrentPage();
      });
    }

    /* ================= GÖREV KARTI ================= */
    function createTaskCard(item, source, key){
      const el = document.createElement('div');
      el.className = `task-card ${item.done ? 'done' : ''}`;
      const typeCol = item.type === 'termin' ? 'var(--frame-termin)' : (item.type === 'hedef' ? 'var(--frame-hedef)' : 'var(--frame-gorev)');
      const tag = (db.tags || []).find(t => t.name === item.tag);
      const tagCol = tag ? tag.color : '#333';
      el.style.borderLeftColor = typeCol;
      el.style.background = `linear-gradient(90deg, ${tagCol}15 0%, var(--card) 100%)`;

      const circle = document.createElement('div');
      circle.className = 'check-circle' + (item.done ? ' checked' : '');
      circle.textContent = '✓';
      circle.onclick = (e) => { e.stopPropagation(); toggleTask(item.id, source, key); };

      /* FIX: başlık ve onclick parametreleri innerHTML'e ham basılıyordu.
         "Ali'nin ödevi" gibi tırnaklı bir başlık kartın tüm butonlarını bozuyordu. */
      const content = document.createElement('div');
      content.className = 'task-content';
      content.onclick = () => openEditTask(item.id, source, key);

      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = item.text || '(başlıksız)';
      if(item.notes && String(item.notes).trim()){
        const n = document.createElement('span');
        n.style.cssText = 'opacity:0.5; font-size:10px;';
        n.textContent = ' 📝';
        title.appendChild(n);
      }
      content.appendChild(title);

      const meta = document.createElement('div');
      meta.style.cssText = 'display:flex; gap:8px; margin-top:4px; font-size:11px; color:var(--muted); flex-wrap:wrap;';
      if(item.time){ const s = document.createElement('span'); s.textContent = '⏰ ' + item.time; meta.appendChild(s); }
      if(item.tag){
        const s = document.createElement('span');
        s.style.cssText = `color:${tagCol}; border:1px solid ${tagCol}44; padding:0 4px; border-radius:4px;`;
        s.textContent = item.tag;
        meta.appendChild(s);
      }
      if(meta.childNodes.length) content.appendChild(meta);

      const moveBtn = document.createElement('button');
      moveBtn.type = 'button'; moveBtn.className = 'icon-btn'; moveBtn.textContent = '📅';
      moveBtn.onclick = (e) => { e.stopPropagation(); quickMoveTask(item.id, source, key); };

      const delBtn = document.createElement('button');
      delBtn.type = 'button'; delBtn.className = 'icon-btn'; delBtn.textContent = '✕';
      delBtn.onclick = (e) => { e.stopPropagation(); deleteTask(item.id, source, key); };

      el.appendChild(circle); el.appendChild(content); el.appendChild(moveBtn); el.appendChild(delBtn);
      return el;
    }

    function getList(source, key){
      if(source === 'inbox') return db.inbox || (db.inbox = []);
      return db.days[key] || null;
    }

    function toggleTask(id, source, key){
      const list = getList(source, key);
      if(!list) return;
      const item = list.find(x => x.id === id);
      if(!item) return;
      item.done = !item.done;
      saveDB(); renderCurrentPage();
    }

    function deleteTask(id, source, key){
      customConfirm('Sil', 'Bu kayıt silinsin mi?', () => {
        if(source === 'inbox') db.inbox = (db.inbox || []).filter(x => x.id !== id);
        else {
          if(!db.days[key]) return;
          db.days[key] = db.days[key].filter(x => x.id !== id);
          if(db.days[key].length === 0) delete db.days[key];
        }
        saveDB(); renderCurrentPage();
      });
    }

    /* FIX: prompt ile "YYYY-MM-DD yaz" isteniyordu; artık gerçek tarih seçici */
    function quickMoveTask(id, source, key){
      const def = (source === 'inbox') ? dayKey(new Date()) : (key || dayKey(new Date()));
      customPrompt('Taşı', 'Hangi güne taşınsın?', def, {type:'date'}, (picked) => {
        if(!picked || !isValidKey(picked)) return;
        let item = null;
        if(source === 'inbox'){
          item = (db.inbox || []).find(x => x.id === id);
          if(!item) return;
          db.inbox = db.inbox.filter(x => x.id !== id);
        } else {
          if(!db.days[key]) return;
          item = db.days[key].find(x => x.id === id);
          if(!item) return;
          db.days[key] = db.days[key].filter(x => x.id !== id);
          if(db.days[key].length === 0) delete db.days[key];
        }
        db.days[picked] = db.days[picked] || [];
        db.days[picked].push(item);
        selectedDate = parseKey(picked);
        saveDB(); renderCurrentPage();
      });
    }

    /* ================= EKLE / DÜZENLE MODALI ================= */
    const fab = document.getElementById('fabBtn');

    function openModal(){ modal.style.display = 'flex'; }
    function closeModal(){ modal.style.display = 'none'; editState = null; applyPendingRemote(); }

    fab.onclick = () => {
      editState = null;
      currentModalDest = (currentPage === 'inbox') ? 'inbox' : 'day';
      document.getElementById('modalTitle').textContent = 'Yeni Ekle';
      document.getElementById('mText').value = '';
      document.getElementById('mTime').value = '';
      document.getElementById('mNote').value = '';
      document.getElementById('mType').value = 'gorev';
      document.getElementById('mDate').value = (currentPage === 'inbox') ? '' : dayKey(selectedDate);
      fillTagSelect();
      document.getElementById('mTag').value = '';
      openModal();
      setTimeout(() => document.getElementById('mText').focus(), 50);
    };

    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('mDateClear').onclick = () => { document.getElementById('mDate').value = ''; };
    /* FIX: modalın dışına dokununca kapanmıyordu */
    modal.onclick = (e) => { if(e.target === modal) closeModal(); };
    habitModal.onclick = (e) => { if(e.target === habitModal) closeHabitModal(); };

    function fillTagSelect(){
      const s = document.getElementById('mTag');
      s.innerHTML = '';
      const none = document.createElement('option'); none.value = ''; none.textContent = 'Etiket Yok';
      s.appendChild(none);
      (db.tags || []).forEach(t => {
        const o = document.createElement('option'); o.value = t.name; o.textContent = t.name;
        s.appendChild(o);
      });
    }

    function openEditTask(id, source, key){
      const list = getList(source, key);
      if(!list) return;
      const item = list.find(x => x.id === id);
      if(!item) return;
      editState = { id, source, key };

      document.getElementById('modalTitle').textContent = 'Düzenle';
      document.getElementById('mText').value = item.text || '';
      document.getElementById('mTime').value = item.time || '';
      document.getElementById('mType').value = item.type || 'gorev';
      document.getElementById('mNote').value = item.notes || '';
      document.getElementById('mDate').value = (source === 'inbox') ? '' : (key || '');
      fillTagSelect();
      document.getElementById('mTag').value = item.tag || '';
      openModal();
    }

    document.getElementById('modalSave').onclick = () => {
      const text = document.getElementById('mText').value.trim();
      if(!text){ document.getElementById('mText').focus(); return; }

      const rawDate = (document.getElementById('mDate').value || '').trim();
      const newDateKey = isValidKey(rawDate) ? rawDate : '';

      const data = {
        text,
        time: document.getElementById('mTime').value,
        type: document.getElementById('mType').value,
        tag: document.getElementById('mTag').value,
        notes: document.getElementById('mNote').value
      };

      if(editState){
        const oldList = getList(editState.source, editState.key);
        if(!oldList){ closeModal(); return; }
        const item = oldList.find(x => x.id === editState.id);
        if(!item){ closeModal(); return; }

        if(editState.source === 'inbox' && newDateKey){
          db.inbox = db.inbox.filter(x => x.id !== editState.id);
          Object.assign(item, data);
          db.days[newDateKey] = db.days[newDateKey] || [];
          db.days[newDateKey].push(item);
          selectedDate = parseKey(newDateKey);
        }
        /* FIX: gün kartında tarihi silip Inbox'a geri atma yolu yoktu */
        else if(editState.source !== 'inbox' && !newDateKey){
          db.days[editState.key] = (db.days[editState.key] || []).filter(x => x.id !== editState.id);
          if(!db.days[editState.key].length) delete db.days[editState.key];
          Object.assign(item, data);
          db.inbox = db.inbox || [];
          db.inbox.push(item);
        }
        else if(editState.source !== 'inbox' && newDateKey && newDateKey !== editState.key){
          db.days[editState.key] = (db.days[editState.key] || []).filter(x => x.id !== editState.id);
          if(!db.days[editState.key].length) delete db.days[editState.key];
          Object.assign(item, data);
          db.days[newDateKey] = db.days[newDateKey] || [];
          db.days[newDateKey].push(item);
          selectedDate = parseKey(newDateKey);
        }
        else Object.assign(item, data);
      } else {
        /* FIX: id olarak Date.now() kullanılıyordu; aynı milisaniyede eklenen iki kayıt
           aynı id'yi alıp birlikte siliniyor/işaretleniyordu. */
        const newItem = { id: uid(), ...data, done: false };
        if(currentModalDest === 'inbox' && !newDateKey){
          db.inbox = db.inbox || [];
          db.inbox.push(newItem);
        } else {
          const k = newDateKey || dayKey(selectedDate);
          db.days[k] = db.days[k] || [];
          db.days[k].push(newItem);
          if(currentModalDest === 'inbox') selectedDate = parseKey(k);
        }
      }

      saveDB();
      closeModal();
      renderCurrentPage();
    };

    /* ================= DİYALOGLAR ================= */
    const dlgTitle = document.getElementById('dialogTitle');
    const dlgMsg = document.getElementById('dialogMsg');
    const dlgInput = document.getElementById('dialogInput');
    const dlgOk = document.getElementById('dialogOk');
    const dlgCancel = document.getElementById('dialogCancel');

    function closeDialog(){ dialogOverlay.style.display = 'none'; applyPendingRemote(); }

    function customConfirm(t, m, cb){
      dlgTitle.textContent = t;
      dlgMsg.textContent = m; dlgMsg.style.display = 'block';
      dlgInput.style.display = 'none';
      dlgCancel.style.display = 'block';
      dlgOk.textContent = 'Tamam';
      dlgOk.onclick = () => { closeDialog(); if(cb) cb(); };
      dialogOverlay.style.display = 'flex';
    }
    function customAlert(t, m){
      dlgTitle.textContent = t;
      dlgMsg.textContent = m; dlgMsg.style.display = 'block';
      dlgInput.style.display = 'none';
      dlgCancel.style.display = 'none';
      dlgOk.textContent = 'Tamam';
      dlgOk.onclick = closeDialog;
      dialogOverlay.style.display = 'flex';
    }
    function customPrompt(t, m, def, opts, cb){
      opts = opts || {};
      dlgTitle.textContent = t;
      dlgMsg.textContent = m; dlgMsg.style.display = m ? 'block' : 'none';
      dlgInput.type = opts.type || 'text';
      dlgInput.value = def || '';
      dlgInput.style.display = 'block';
      dlgInput.style.height = (opts.type === 'color') ? '48px' : '';
      dlgInput.style.padding = (opts.type === 'color') ? '4px' : '12px';
      dlgCancel.style.display = 'block';
      dlgOk.textContent = 'Tamam';
      const done = () => { const v = dlgInput.value; closeDialog(); if(cb) cb(v); };
      dlgOk.onclick = done;
      dlgInput.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); done(); } };
      dialogOverlay.style.display = 'flex';
      setTimeout(() => dlgInput.focus(), 50);
    }
    dlgCancel.onclick = closeDialog;
    dialogOverlay.onclick = (e) => { if(e.target === dialogOverlay) closeDialog(); };

    /* ================= SWIPE ================= */
    /* FIX: sadece X'e bakılıyordu; dikey kaydırırken gün değişiyordu.
       Ayrıca modal açıkken de tetikleniyordu. */
    appWrap.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    appWrap.addEventListener('touchend', (e) => {
      if(anyOverlayOpen()) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if(currentPage === 'daily' || currentPage === 'routine') changeDay(dx < 0 ? 1 : -1);
      else if(currentPage === 'calendar') changeMonth(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* ================= AUTH BUTONLARI ================= */
    const authError = document.getElementById('authError');

    document.getElementById('btnLogin').onclick = async () => {
      if(!_supabase){ authError.textContent = 'Sunucu bağlantısı yok. Çevrimdışı devam edebilirsin.'; return; }
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value;
      if(!email || !pass){ authError.textContent = 'E-posta ve şifre gerekli.'; return; }
      authError.textContent = 'Giriş yapılıyor...';
      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password: pass });
        if(error){ authError.textContent = error.message; return; }
        authError.textContent = '';
        /* FIX: eskiden location.reload() ediliyordu; gereksiz tam yeniden yükleme */
        if(data && data.session) handleSession(data.session);
      } catch(err){ authError.textContent = 'Giriş hatası: ' + (err.message || err); }
    };
    document.getElementById('authPass').onkeydown = (e) => { if(e.key === 'Enter') document.getElementById('btnLogin').click(); };

    /* FIX: "Kayıt Ol" butonunun hiçbir olay bağı yoktu, tıklayınca hiçbir şey olmuyordu */
    document.getElementById('btnSignup').onclick = async () => {
      if(!_supabase){ authError.textContent = 'Sunucu bağlantısı yok.'; return; }
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value;
      if(!email || pass.length < 6){ authError.textContent = 'Geçerli e-posta ve en az 6 karakterli şifre gir.'; return; }
      try {
        const { error } = await _supabase.auth.signUp({ email, password: pass });
        authError.textContent = error ? error.message : 'Kayıt başarılı. Doğrulama gerekiyorsa e-postanı kontrol et.';
      } catch(err){ authError.textContent = err.message || String(err); }
    };

    document.getElementById('btnOffline').onclick = () => offlineMode('Çevrimdışı devam edildi.');

    function logoutApp(){
      customConfirm('Çıkış', 'Emin misiniz?', async () => {
        try { await flushSave(); } catch(e){}
        try { if(_supabase) await _supabase.auth.signOut(); } catch(e){}
        try { localStorage.removeItem(LOCAL_KEY); } catch(e){}
        window.location.reload();
      });
    }

    initApp();
  </script>
</body>
