<!doctype html>
<html lang="tr">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>todoapp</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icon-512.png" />
  <link rel="apple-touch-icon" href="./icon-512.png" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(()=>{});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#0f0f10; --card:#17171a; --muted:#a3a3a3; --text:#f5f5f5; --line:#2a2a2f; --accent:#7dd3fc;
      --nav-height: 60px;
      --frame-termin:#fb7185; --frame-hedef:#60a5fa; --frame-gorev:#34d399;
    }
    *{ box-sizing:border-box; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body{ height:100%; margin:0; background:var(--bg); color:var(--text); overflow:hidden; }

    #errBar{ display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
      background:#7f1d1d; color:#fff; font:11px/1.5 ui-monospace,monospace; padding:8px 12px;
      white-space:pre-wrap; max-height:35vh; overflow:auto; }
    #errBar .x{ position:absolute; top:4px; right:8px; background:none; border:none; color:#fff; font-size:16px; }

    #authOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .authBox { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; text-align:center; }
    .authBox input { width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid var(--line); color:#fff; border-radius:10px; }
    .authBtn { width:100%; padding:12px; background:var(--accent); color:#000; font-weight:bold; border:0; border-radius:10px; cursor:pointer; margin-top:5px; }
    .app-container { height: 100%; display: flex; flex-direction: column; }
    .page-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; position: relative; -webkit-overflow-scrolling: touch; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); background: none; border: none; font-size: 9.5px; cursor: pointer; flex: 1; min-width: 0; padding: 0 2px; }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 20px; line-height: 1; }
    h2 { margin: 0 0 16px 0; font-size: 22px; font-weight: 700; }
    .btn { background:var(--card); border:1px solid var(--line); color:var(--text); padding:8px 12px; border-radius:10px; cursor:pointer; }
    .btn-primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
    .fab { position: fixed; bottom: 75px; right: 20px; width: 56px; height: 56px; background: var(--accent); color: #000; border-radius: 50%; display: grid; place-items: center; font-size: 30px; box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 90; border:none; cursor: pointer; }
    .daily-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .date-display { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .date-big { font-size: 18px; font-weight: bold; }
    .date-small { font-size: 13px; color: var(--muted); }
    .arrow-btn { background: transparent; border: none; color: var(--text); font-size: 24px; padding: 10px; cursor: pointer; }
    .today-btn { background: none; border: 1px solid var(--line); color: var(--accent); font-size: 11px; padding: 4px 10px; border-radius: 20px; margin-bottom: 20px; cursor: pointer; display: inline-block; }
    .task-card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--line); border-left-width: 4px; transition: all 0.2s ease; }
    .task-card.done { opacity: 0.5; }
    .check-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; display: grid; place-items: center; cursor: pointer; margin-top: 2px; }
    .check-circle.checked { background: var(--accent); border-color: var(--accent); color: #000; font-weight: bold; font-size: 14px; }
    .task-content { flex:1; cursor: pointer; min-width: 0; }
    .task-title { font-size:14px; overflow-wrap:anywhere; }
    .icon-btn { background:none; border:none; color:#555; font-size:15px; cursor:pointer; padding:2px 4px; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 15px; }
    .cal-cell { aspect-ratio: 1; background: var(--card); border-radius: 8px; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
    .cal-cell.today { border-color: var(--accent); color: var(--accent); font-weight: bold; }
    .cal-cell.active-day { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: bold; }
    .dots { display: flex; gap: 2px; margin-top: 2px; height:4px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; }

    .habit-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--line); }
    .habit-left { display: flex; align-items: center; gap: 12px; flex:1; cursor:pointer; min-width:0; }
    .habit-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .streak-badge { font-size:12px; background:#2a2a2f; padding:4px 8px; border-radius:8px; color:#fbbf24; margin-left:auto; display:flex; align-items:center; gap:4px; border: 1px solid #444; flex-shrink:0; }
    .tag-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--card); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
    .tag-ctrl-btn { background: #000; color: #fff; border: 1px solid #333; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; font-size: 10px; }
    .color-dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); flex-shrink: 0; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; align-items: flex-end; }
    .modal-sheet { width: 100%; background: #1c1c1e; border-radius: 20px 20px 0 0; padding: 20px; animation: slideUp 0.3s ease; display:flex; flex-direction:column; max-height:90vh; overflow-y:auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--line); color: #fff; border-radius: 10px; margin-bottom: 10px; }
    .modal-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .modal-select { flex: 1; padding: 10px; background: #000; border: 1px solid var(--line); color: #fff; border-radius: 8px; }

    .habit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .habit-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top:15px; }
    .habit-cal-cell { aspect-ratio:1; background:#000; border-radius:6px; border:1px solid #333; display:flex; align-items:center; justify-content:center; font-size:12px; color:#555; }
    .habit-cal-cell.done { background:var(--accent); color:#000; font-weight:bold; border-color:var(--accent); }
    .habit-cal-cell.today { border-color:var(--accent); color:var(--accent); }

    /* ===== RUTİN TABLOSU ===== */
    .rt-sticky { position:sticky; top:0; z-index:5; background:var(--bg); margin:-16px -16px 6px; padding:12px 16px 6px; box-shadow:0 8px 10px -9px #000; }
    .rt-toolbar { display:flex; gap:5px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .seg button { border:0; background:transparent; color:var(--muted); padding:5px 10px; font-size:11.5px; cursor:pointer; }
    .seg button.active { color:var(--text); background:#2a2a2f; }
    .rt-mini-btn { background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:10.5px; padding:5px 8px; border-radius:8px; cursor:pointer; }
    .ghost-badge { font-size:10px; color:#fbbf24; border:1px solid #fbbf2455; background:#fbbf2412; padding:2px 6px; border-radius:20px; }

    .week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
    .ws-col { display:flex; flex-direction:column; gap:2px; cursor:pointer; padding:3px 2px; border-radius:7px; border:1px solid transparent; }
    .ws-col.sel { border-color:var(--accent); background:#7dd3fc0f; }
    .ws-col.today .ws-name { color:var(--accent); }
    .ws-name { font-size:10px; text-align:center; color:var(--muted); font-weight:600; }
    .ws-date { font-size:9px; text-align:center; color:#555; }
    .ws-bars { display:flex; flex-direction:column; gap:1px; height:42px; margin-top:2px; }
    .ws-bar { flex:1; min-height:1px; border-radius:1px; background:#232328; }

    .rt-row { display:flex; gap:7px; align-items:stretch; margin-bottom:3px; }
    .rt-hour { width:46px; flex-shrink:0; font-size:9.5px; color:var(--muted); display:flex; align-items:center; justify-content:flex-end; line-height:1.25; text-align:right; }
    .rt-block { flex:1; min-width:0; border-radius:10px; border:1px solid var(--line); background:var(--card); padding:8px 10px; display:flex; align-items:center; gap:9px; cursor:pointer; min-height:40px; }
    .rt-block.empty { border-style:dashed; border-color:#26262c; background:transparent; color:#3d3d44; font-size:11px; justify-content:center; min-height:24px; }
    .rt-block.ghost { background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 6px, transparent 6px 12px); }
    .rt-text { flex:1; min-width:0; font-size:13.5px; overflow-wrap:anywhere; line-height:1.25; }
    .rt-block.done .rt-text { opacity:.45; text-decoration:line-through; }
    .rt-hb { font-size:10px; color:var(--accent); flex-shrink:0; }
    .rt-now { border-color:var(--frame-termin) !important; box-shadow:0 0 0 1px var(--frame-termin); }
    .rt-block .check-circle { width:20px; height:20px; margin-top:0; }

    /* rutin bloğunun altına inen görev/termin satırları */
    .rt-task { flex:1; min-width:0; margin-left:12px; display:flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:9px; background:#141417; border:1px solid var(--line);
      border-left:3px solid var(--frame-gorev); font-size:12.5px; cursor:pointer; min-height:32px; }
    .rt-task.done { opacity:.45; }
    .rt-task.done .rt-task-text { text-decoration:line-through; }
    .rt-task-text { flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.25; }
    .rt-task .check-circle { width:17px; height:17px; margin-top:0; font-size:10px; border-width:1.5px; }
    .rt-task-tag { font-size:9.5px; padding:1px 5px; border-radius:4px; flex-shrink:0; }
    .rt-hour.sub { font-size:9px; color:#4a4a52; }
    .rt-loose { margin:0 0 10px; display:flex; flex-wrap:wrap; gap:6px; }
    .rt-loose-lbl { font-size:10.5px; color:#4a4a52; margin-bottom:5px; }

    .sw-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .sw { width:32px; height:32px; border-radius:9px; border:2px solid transparent; cursor:pointer; }
    .sw.sel { border-color:#fff; }
    .sw.none { background:linear-gradient(45deg, transparent 44%, #fb7185 44%, #fb7185 56%, transparent 56%), #000; border:1px solid var(--line); }

    #dialogOverlay { display:none; }

    @media (min-width: 768px) {
      body { background: #050505; }
      .app-container { max-width: 700px; margin: 0 auto; background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 100vh; }
      .bottom-nav { max-width: 700px; left: 50%; transform: translateX(-50%); border-right: 1px solid var(--line); border-left: 1px solid var(--line); }
      .fab { right: auto; left: 50%; margin-left: 270px; }
      .modal-sheet { max-width: 700px; margin: 0 auto; left: 0; right: 0; }
    }
  </style>
</head>
<body>

  <div id="errBar"><button class="x" type="button" onclick="this.parentNode.style.display='none'">✕</button><span id="errText"></span></div>

  <div id="authOverlay">
    <div class="authBox">
      <h2>todoapp</h2>
      <p style="color:#aaa; font-size:13px;">Devam etmek için giriş yap</p>
      <input type="email" id="authEmail" placeholder="E-posta" autocomplete="email" />
      <input type="password" id="authPass" placeholder="Şifre" autocomplete="current-password" />
      <div id="authError" style="color:#fb7185; font-size:12px; min-height:20px;"></div>
      <button id="btnLogin" class="authBtn" type="button">Giriş Yap</button>
      <button id="btnSignup" class="btn" type="button" style="width:100%; margin-top:10px; border:none; background:transparent; color:#aaa;">Kayıt Ol</button>
      <button id="btnOffline" class="btn" type="button" style="width:100%; margin-top:4px; border:none; background:transparent; color:#555; font-size:12px;">Çevrimdışı devam et</button>
    </div>
  </div>

  <div id="dialogOverlay" class="modal-overlay" style="z-index: 300; align-items:center; justify-content:center;">
    <div class="authBox" style="background:#1c1c1e; border:1px solid var(--line); width:90%; max-width:320px;">
      <h3 id="dialogTitle" style="margin-top:0;">Başlık</h3>
      <p id="dialogMsg" style="color:var(--muted); font-size:14px; margin-bottom:15px;"></p>
      <input type="text" id="dialogInput" class="modal-input" style="display:none;" />
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button id="dialogCancel" class="btn" type="button" style="flex:1;">İptal</button>
        <button id="dialogOk" class="btn btn-primary" type="button" style="flex:1;">Tamam</button>
      </div>
    </div>
  </div>

  <div id="appWrap" class="app-container" style="display:none;">
    <div id="pageContainer" class="page-content"></div>
    <button id="fabBtn" class="fab" type="button">+</button>
    <nav class="bottom-nav">
      <button class="nav-item active" type="button" onclick="router('daily')"><span class="nav-icon">📅</span><span>Günlük</span></button>
      <button class="nav-item" type="button" onclick="router('routine')"><span class="nav-icon">⏱️</span><span>Rutin</span></button>
      <button class="nav-item" type="button" onclick="router('calendar')"><span class="nav-icon">🗓️</span><span>Takvim</span></button>
      <button class="nav-item" type="button" onclick="router('inbox')"><span class="nav-icon">📥</span><span>Inbox</span></button>
      <button class="nav-item" type="button" onclick="router('habits')"><span class="nav-icon">✅</span><span>Habits</span></button>
      <button class="nav-item" type="button" onclick="router('settings')"><span class="nav-icon">⚙️</span><span>Ayarlar</span></button>
    </nav>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-sheet">
      <h3 id="modalTitle" style="margin-top:0;">Yeni Ekle</h3>

      <input type="text" id="mText" class="modal-input" placeholder="Başlık..." maxlength="200" />

      <div class="modal-row">
        <input type="time" id="mTime" class="modal-input" style="flex:1; margin-bottom:0;" />
        <select id="mType" class="modal-select">
          <option value="gorev">Görev</option>
          <option value="termin">Termin</option>
          <option value="hedef">Hedef</option>
        </select>
      </div>

      <div class="modal-row">
        <input type="date" id="mDate" class="modal-input" style="flex:1; margin-bottom:0;" />
        <button id="mDateClear" class="btn" type="button" title="Tarihi kaldır, kaydı Inbox listesine al">Inbox</button>
      </div>

      <select id="mTag" class="modal-select" style="width:100%; margin-bottom:10px;"></select>
      <textarea id="mNote" class="modal-input" placeholder="Notlar..." rows="3" style="resize:none; margin-bottom:15px; font-family:inherit;"></textarea>

      <div style="display:flex; gap:10px;">
        <button id="modalClose" class="btn" type="button" style="flex:1;">İptal</button>
        <button id="modalSave" class="btn btn-primary" type="button" style="flex:1;">Kaydet</button>
      </div>
    </div>
  </div>

  <div id="rtModal" class="modal-overlay">
    <div class="modal-sheet">
      <h3 id="rtModalTitle" style="margin-top:0;">Saat</h3>
      <div id="rtModalWhere" style="font-size:12px; color:var(--muted); margin-bottom:12px;"></div>

      <input type="text" id="rtText" class="modal-input" placeholder="Ne yapılacak?" maxlength="80" />

      <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">Renk</div>
      <div class="sw-row" id="rtSwatches"></div>

      <div class="modal-row">
        <div style="flex:1;">
          <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">Süre</div>
          <select id="rtSpan" class="modal-select" style="width:100%;"></select>
        </div>
        <div style="flex:1;">
          <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">Alışkanlık</div>
          <select id="rtHabit" class="modal-select" style="width:100%;"></select>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button id="rtDelete" class="btn" type="button" style="flex:1; border-color:#fb7185; color:#fb7185;">Temizle</button>
        <button id="rtCancel" class="btn" type="button" style="flex:1;">İptal</button>
        <button id="rtSave" class="btn btn-primary" type="button" style="flex:1;">Kaydet</button>
      </div>
    </div>
  </div>

  <div id="habitModal" class="modal-overlay"
    <div class="modal-sheet" style="max-height: 90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="flex:1"></div>
        <button type="button" onclick="closeHabitModal()" style="background:none; border:none; color:#555; font-size:20px;">✕</button>
      </div>
      <div class="habit-header">
        <button class="arrow-btn" type="button" onclick="changeHabitMonth(-1)">❮</button>
        <div style="text-align:center;">
            <h3 id="habitDetailTitle" style="margin:0;">Alışkanlık</h3>
            <div id="habitDetailMonth" style="font-size:12px; color:var(--muted); margin-top:2px;"></div>
        </div>
        <button class="arrow-btn" type="button" onclick="changeHabitMonth(1)">❯</button>
      </div>
      <div id="habitDetailStats" style="text-align:center; margin-bottom:15px; font-weight:bold; color:var(--accent);"></div>
      <div id="habitCalendar" class="habit-cal-grid"></div>
    </div>
  </div>

  <script>
    /* ================= HATA GÖSTERİCİSİ ================= */
    function showErr(msg){
      const bar = document.getElementById('errBar'), t = document.getElementById('errText');
      if(!bar || !t) return;
      bar.style.display = 'block';
      t.textContent = t.textContent + (t.textContent ? '\n' : '') + msg;
    }
    window.addEventListener('error', e => showErr('HATA: ' + e.message + ' (satır ' + (e.lineno||0) + ')'));
    window.addEventListener('unhandledrejection', e => {
      const r = e.reason;
      showErr('PROMISE HATASI: ' + (r && r.message ? r.message : String(r)));
    });

    /* ================= SUPABASE ================= */
    const SUPABASE_URL = "https://czuprhvrnlqpipcytvwx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IR67FHQQNsnA9aNMizaqUA_HYGC8cKM";
    const LOCAL_KEY = 'mini_todo_v1';
    let _supabase = null;
    /* FIX: supabase CDN yüklenmediyse burada throw oluyor ve dosyanın geri kalanı hiç
       çalışmıyordu -> giriş ekranı donuk kalıyordu. */
    try {
      if(typeof supabase === 'undefined') showErr('Supabase kütüphanesi yüklenemedi (internet/CDN).');
      else if(SUPABASE_URL && SUPABASE_KEY) _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(err){ showErr('Supabase başlatılamadı: ' + (err.message||err)); }

    /* FIX: localStorage gizli sekmede / kota dolunca throw ediyordu */
    function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
    function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
    function lsParse(k){ try { const r = lsGet(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }

    /* ================= STATE ================= */
    function emptyRoutine(){ return { cfg:{start:7,end:23}, dayThemes:{}, template:{}, weeks:{}, done:{} }; }
    function emptyDB(){
      return { days:{}, inbox:[], tags:[{name:'genel', color:'#7dd3fc'}], habits:[], habitHistory:{}, routine: emptyRoutine() };
    }
    /* FIX: sunucudan/realtime'dan gelen içerikte alanlar eksikse (tags, days, habitHistory)
       renderSettings / sortTasks / renderHabits çöküyordu. Her girişte normalize ediliyor. */
    function normalize(d){
      d = (d && typeof d === 'object') ? d : {};
      d.days = (d.days && typeof d.days === 'object' && !Array.isArray(d.days)) ? d.days : {};
      d.inbox = Array.isArray(d.inbox) ? d.inbox : [];
      d.tags = (Array.isArray(d.tags) && d.tags.length) ? d.tags : [{name:'genel', color:'#7dd3fc'}];
      d.habits = Array.isArray(d.habits) ? d.habits : [];
      d.habitHistory = (d.habitHistory && typeof d.habitHistory === 'object') ? d.habitHistory : {};
      for(const k in d.days){
        if(!Array.isArray(d.days[k]) || !d.days[k].length) delete d.days[k];
      }
      d.habits.forEach((h,i) => {
        if(h.order === undefined || h.order === null) h.order = i;
        if(!h.color) h.color = '#7dd3fc';
      });
      for(const id in d.habitHistory){
        if(!Array.isArray(d.habitHistory[id])) d.habitHistory[id] = [];
      }
      /* Rutin tablosu — masaüstü sürümüyle birebir aynı yapı, ikisi aynı veriyi paylaşır */
      const r = Object.assign(emptyRoutine(), (d.routine && typeof d.routine === 'object') ? d.routine : {});
      let cs = Number((r.cfg||{}).start), ce = Number((r.cfg||{}).end);
      if(!Number.isFinite(cs) || cs < 0 || cs > 23) cs = 7;
      if(!Number.isFinite(ce) || ce <= cs || ce > 24) ce = Math.max(cs+1, 23);
      r.cfg = { start: cs, end: ce };
      r.dayThemes = (r.dayThemes && typeof r.dayThemes === 'object') ? r.dayThemes : {};
      r.template  = (r.template  && typeof r.template  === 'object') ? r.template  : {};
      r.weeks     = (r.weeks     && typeof r.weeks     === 'object') ? r.weeks     : {};
      r.done      = (r.done      && typeof r.done      === 'object') ? r.done      : {};
      d.routine = r;
      return d;
    }

    let db = emptyDB();
    let currentUser = null;
    let currentPage = 'daily';
    let selectedDate = new Date();
    let calAnchor = new Date();          /* FIX: takvim ayı artık selectedDate'i bozmuyor */
    let currentModalDest = 'day';
    let editState = null;
    let touchStartX = 0, touchStartY = 0;
    let selectedHabitId = null, selectedHabitMonth = new Date();
    let pendingRemote = null;            /* modal açıkken gelen uzak güncelleme */
    let lastSentSnapshot = '';

    const appWrap = document.getElementById('appWrap');
    const authOverlay = document.getElementById('authOverlay');
    const pageContainer = document.getElementById('pageContainer');
    const modal = document.getElementById('modalOverlay');
    const dialogOverlay = document.getElementById('dialogOverlay');
    const habitModal = document.getElementById('habitModal');

    function anyOverlayOpen(){
      const rt = document.getElementById('rtModal');
      return modal.style.display === 'flex' || dialogOverlay.style.display === 'flex'
          || habitModal.style.display === 'flex' || rt.style.display === 'flex';

    /* ================= AUTH ================= */
    async function initApp(){
      if(!_supabase){ offlineMode('Sunucuya bağlanılamıyor.'); return; }
      try {
        const { data: { session } } = await _supabase.auth.getSession();
        if(session) handleSession(session);
        else authOverlay.style.display = 'flex';
        /* FIX: oturum yenilenmesi / başka sekmede çıkış artık yakalanıyor */
        _supabase.auth.onAuthStateChange((_e, s) => {
          if(s && (!currentUser || currentUser.id !== s.user.id)) handleSession(s);
          else if(!s && currentUser){ currentUser = null; appWrap.style.display='none'; authOverlay.style.display='flex'; }
        });
      } catch(err){
        offlineMode('Sunucuya ulaşılamadı: ' + (err.message||err));
      }
    }

    function offlineMode(reason){
      currentUser = null;
      authOverlay.style.display = 'none';
      appWrap.style.display = 'flex';
      showErr('ÇEVRİMDIŞI MOD — ' + reason + '\nDeğişiklikler sadece bu cihazda saklanır.');
      db = normalize(lsParse(LOCAL_KEY) || emptyDB());
      router('daily');
    }

    let realtimeChannel = null;
    async function handleSession(session){
      currentUser = session.user;
      authOverlay.style.display = 'none';
      appWrap.style.display = 'flex';
      try { await loadRemoteDB(); }
      catch(err){
        showErr('Veri çekilemedi, yerel kopya kullanılıyor: ' + (err.message||err));
        db = normalize(lsParse(LOCAL_KEY) || emptyDB());
      }
      subscribeRealtime();
      router('daily');
    }

    /* FIX: kanal tüm tabloyu dinliyordu ve her kendi kaydımız geri gelip ekranı
       yeniden çiziyordu (yazarken sıçrama / modal içeriğinin ezilmesi).
       Artık sadece kendi satırımız dinleniyor ve kendi yazdığımız echo atlanıyor. */
    function subscribeRealtime(){
      if(!_supabase || !currentUser) return;
      if(realtimeChannel){ try { _supabase.removeChannel(realtimeChannel); } catch(e){} }
      realtimeChannel = _supabase
        .channel('user_data_' + currentUser.id)
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'user_data', filter: 'id=eq.' + currentUser.id },
          payload => {
            const c = payload && payload.new && payload.new.content;
            if(!c) return;
            const s = JSON.stringify(c);
            if(s === lastSentSnapshot || s === JSON.stringify(db)) return;   // kendi yazdığımız
            if(anyOverlayOpen()){ pendingRemote = c; return; }               // düzenleme sürüyorsa bekle
            db = normalize(c);
            lsSet(LOCAL_KEY, JSON.stringify(db));
            renderCurrentPage();
          })
        .subscribe();
    }
    function applyPendingRemote(){
      if(!pendingRemote) return;
      db = normalize(pendingRemote);
      pendingRemote = null;
      lsSet(LOCAL_KEY, JSON.stringify(db));
      renderCurrentPage();
    }

    async function loadRemoteDB(){
      const local = lsParse(LOCAL_KEY);
      if(local) db = normalize(local);
      /* FIX: .single() satır yokken hata fırlatıyordu; .maybeSingle() doğrusu */
      const { data, error } = await _supabase.from('user_data').select('content').eq('id', currentUser.id).maybeSingle();
      if(error) throw error;
      if(data && data.content){
        db = normalize(data.content);
        lsSet(LOCAL_KEY, JSON.stringify(db));
      } else {
        db = normalize(local || emptyDB());
        saveDB();
      }
    }

    /* FIX: her tık anında upsert atıyordu (hızlı işaretlemede istek yağmuru + realtime echo).
       Artık 800ms debounce + hata yakalama + sekme kapanırken flush. */
    let saveTimer = null, pendingSave = false;
    function saveDB(){
      lsSet(LOCAL_KEY, JSON.stringify(db));
      pendingSave = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 800);
    }
    async function flushSave(){
      clearTimeout(saveTimer);
      if(!pendingSave) return;
      if(!currentUser || !_supabase){ pendingSave = false; return; }
      pendingSave = false;
      const snapshot = JSON.stringify(db);
      try {
        const { error } = await _supabase.from('user_data')
          .upsert({ id: currentUser.id, content: db, updated_at: new Date().toISOString() });
        if(error) throw error;
        lastSentSnapshot = snapshot;
      } catch(err){
        pendingSave = true;
        showErr('Senkronizasyon hatası: ' + (err && err.message ? err.message : String(err)));
      }
    }
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSave(); });

    /* ================= YARDIMCILAR ================= */
    function dayKey(d){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    /* FIX: new Date("2026-01-05") UTC olarak parse edilir; negatif saat diliminde
       bir gün geriye kayıyordu. Yerel saatle parse ediliyor. */
    function parseKey(k){
      const p = String(k||'').split('-').map(Number);
      if(p.length !== 3 || p.some(isNaN)) return new Date();
      return new Date(p[0], p[1]-1, p[2]);
    }
    function isValidKey(k){ return /^\d{4}-\d{2}-\d{2}$/.test(k||''); }
    function uid(){
      return (crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    /* NOT: burada bilerek regex kullanılmıyor. Tırnak karakteri içeren bir karakter
       sınıfı (&<> ve tırnaklar) çoğu editörün renklendiricisini bozup dosyanın
       geri kalanını renksiz bırakıyor. Düz split/join aynı işi görüyor. */
    function esc(s){
      return String(s == null ? '' : s)
        .split('&').join('&amp;')
        .split('<').join('&lt;')
        .split('>').join('&gt;')
        .split(String.fromCharCode(34)).join('&quot;')
        .split(String.fromCharCode(39)).join('&#39;');
    }

    function sortTasks(tasks) {
      if(!Array.isArray(tasks)) return [];
      const typeWeight = { 'termin': 1, 'hedef': 2, 'gorev': 3 };
      const tags = db.tags || [];
      return [...tasks].sort((a, b) => {
        const tA = typeWeight[a.type] || 3;
        const tB = typeWeight[b.type] || 3;
        if(tA !== tB) return tA - tB;
        const getMins = (timeStr) => {
          if(!timeStr) return 9999;
          const [h, m] = String(timeStr).split(':').map(Number);
          if(isNaN(h) || isNaN(m)) return 9999;
          return h * 60 + m;
        };
        const timeDiff = getMins(a.time) - getMins(b.time);
        if(timeDiff !== 0) return timeDiff;
        const tagA = tags.findIndex(t => t.name === a.tag);
        const tagB = tags.findIndex(t => t.name === b.tag);
        return (tagA === -1 ? 999 : tagA) - (tagB === -1 ? 999 : tagB);
      });
    }

    /* ================= ROUTER ================= */
    function router(page){
      currentPage = page;
      const items = document.querySelectorAll('.nav-item');
      items.forEach(btn => btn.classList.remove('active'));
      const map = {'daily':0, 'routine':1, 'calendar':2, 'inbox':3, 'habits':4, 'settings':5};
      if(items[map[page]]) items[map[page]].classList.add('active');
      document.getElementById('fabBtn').style.display = ['daily', 'calendar', 'inbox'].includes(page) ? 'grid' : 'none';
      if(page === 'calendar') calAnchor = new Date(selectedDate);
      if(page === 'routine') rtScrollToNow = true;
      pageContainer.scrollTop = 0;
      renderCurrentPage();
    }

    function renderCurrentPage(){
      pageContainer.innerHTML = '';
      try {
        if(currentPage === 'daily') renderDaily();
        else if(currentPage === 'routine') renderRoutine();
        else if(currentPage === 'calendar') renderCalendar();
        else if(currentPage === 'inbox') renderInbox();
        else if(currentPage === 'habits') renderHabits();
        else if(currentPage === 'settings') renderSettings();
      } catch(err){ showErr('Ekran çizilemedi: ' + (err.message||err)); }
    }

      const d = document.createElement('div');

    /* ================= GÜNLÜK ================= */

    /* ================= TAKVİM ================= */
    function renderCalendar(){
      const year = calAnchor.getFullYear();
      const month = calAnchor.getMonth();

      const firstDayOfMonth = new Date(year, month, 1);
      let startDay = firstDayOfMonth.getDay();
      startDay = (startDay === 0) ? 6 : startDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const header = document.createElement('div');
      header.className = 'daily-header';
      header.innerHTML = `
        <button class="arrow-btn" type="button">❮</button>
        <h2 style="margin:0">${esc(firstDayOfMonth.toLocaleDateString('tr-TR', {month:'long', year:'numeric'}))}</h2>
        <button class="arrow-btn" type="button">❯</button>
      `;
      header.children[0].onclick = () => changeMonth(-1);
      header.children[2].onclick = () => changeMonth(1);
      pageContainer.appendChild(header);

      const grid = document.createElement('div'); grid.className = 'calendar-grid';
      ['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].forEach(d => {
        const c = document.createElement('div');
        c.style.cssText = 'text-align:center; font-size:12px; color:var(--muted);';
        c.textContent = d; grid.appendChild(c);
      });
      for(let i=0; i<startDay; i++) grid.appendChild(document.createElement('div'));

      const todayK = dayKey(new Date()), selK = dayKey(selectedDate);
      for(let d=1; d<=daysInMonth; d++){
        const currK = dayKey(new Date(year, month, d));
        const dayItems = db.days[currK] || [];
        let dotsHtml = '';
        if(dayItems.length > 0){
          if(dayItems.some(x => x.type === 'termin' && !x.done)) dotsHtml += `<span class="dot" style="background:var(--frame-termin)"></span>`;
          if(dayItems.some(x => x.type === 'hedef' && !x.done)) dotsHtml += `<span class="dot" style="background:var(--frame-hedef)"></span>`;
          if(!dotsHtml && dayItems.some(x => !x.done)) dotsHtml += `<span class="dot" style="background:var(--muted)"></span>`;
        }
        const cell = document.createElement('div');
        cell.className = `cal-cell ${currK === todayK ? 'today' : ''} ${currK === selK ? 'active-day' : ''}`;
        cell.innerHTML = `<div>${d}</div><div class="dots">${dotsHtml}</div>`;
        cell.onclick = () => {
          /* seçili güne ikinci kez dokununca günlük ekrana atla */
          if(dayKey(selectedDate) === currK){ router('daily'); return; }
          selectedDate = new Date(year, month, d);
          renderCurrentPage();
        };
        grid.appendChild(cell);
      }
      pageContainer.appendChild(grid);

      const selKey = dayKey(selectedDate);
      const selItems = sortTasks((db.days[selKey] || []).filter(x => ['termin','hedef'].includes(x.type)));
      const bottom = document.createElement('div');
      const hint = document.createElement('div');
      hint.style.cssText = 'margin-top:20px; border-top:1px solid var(--line); padding-top:10px; color:var(--muted); font-size:13px;';
      hint.textContent = `${selectedDate.toLocaleDateString('tr-TR')} — Önemli Kayıtlar`;
      bottom.appendChild(hint);
      if(selItems.length === 0){
        const n = document.createElement('div');
        n.style.cssText = 'color:#555; font-size:12px; margin-top:5px;';
        n.textContent = 'Kayıt yok.';
        bottom.appendChild(n);
      } else selItems.forEach(item => bottom.appendChild(createTaskCard(item, 'day', selKey)));
      pageContainer.appendChild(bottom);
    }

    /* FIX: changeMonth selectedDate.setDate(1) yapıyordu -> takvimde ay değiştirip
       Günlük sekmesine dönünce hep ayın 1'i görünüyordu. Ayrı çapa kullanılıyor. */
    function changeMonth(delta){
      calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + delta, 1);

    /* ================= INBOX ================= */
    function renderInbox(){

    /* ================= HABITS ================= */
    function renderHabits(){
      const head = document.createElement('div');
      head.style.cssText = 'display:flex; justify-content:space-between; align-items:center;';
      const h2 = document.createElement('h2'); h2.textContent = 'Alışkanlıklar';
      const addBtn = document.createElement('button');
      addBtn.className = 'btn'; addBtn.type = 'button'; addBtn.textContent = '+ Ekle';
      addBtn.onclick = addNewHabit;
      head.appendChild(h2); head.appendChild(addBtn);
      pageContainer.appendChild(head);

      const todayK = dayKey(new Date());
      const habitsSorted = [...(db.habits || [])].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      if(!habitsSorted.length){ pageContainer.appendChild(emptyMsg('Henüz alışkanlık yok.')); return; }

      habitsSorted.forEach((h, idx) => {
        const hist = db.habitHistory[h.id] || [];
        const isDone = hist.includes(todayK);
        const streak = calculateStreak(hist);
        const col = h.color || '#7dd3fc';

        const div = document.createElement('div');
        div.className = 'habit-row';
        div.style.borderLeft = `4px solid ${col}`;
        div.style.background = `linear-gradient(90deg, ${col}15 0%, var(--card) 100%)`;

        /* FIX: isim innerHTML'e ham basılıyordu; içinde tırnak/açılı parantez olan
           alışkanlık adı butonların onclick'lerini bozuyordu. DOM ile kuruluyor. */
        const left = document.createElement('div');
        left.className = 'habit-left';
        left.onclick = () => openHabitDetail(h.id);

        const circle = document.createElement('div');
        circle.className = 'check-circle' + (isDone ? ' checked' : '');
        circle.textContent = '✓';
        circle.onclick = (e) => { e.stopPropagation(); toggleHabit(h.id); };

        const name = document.createElement('div');
        name.className = 'habit-name';
        name.textContent = h.name;
        if(isDone) name.style.opacity = '0.5';

        left.appendChild(circle); left.appendChild(name);
        if(streak > 0){
          const b = document.createElement('div');
          b.className = 'streak-badge'; b.textContent = '🔥 ' + streak;
          left.appendChild(b);
        }
        div.appendChild(left);

        const colorInput = document.createElement('input');
        colorInput.type = 'color'; colorInput.value = col; colorInput.style.display = 'none';
        colorInput.onchange = () => setHabitColor(h.id, colorInput.value);

        const mk = (label, fn, disabled) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'icon-btn'; b.textContent = label;
          if(disabled){ b.disabled = true; b.style.opacity = '.25'; }
          else b.onclick = (e) => { e.stopPropagation(); fn(); };
          return b;
        };
        div.appendChild(mk('🎨', () => colorInput.click()));
        div.appendChild(colorInput);
        div.appendChild(mk('▲', () => moveHabit(h.id, -1), idx === 0));
        div.appendChild(mk('▼', () => moveHabit(h.id, 1), idx === habitsSorted.length - 1));
        div.appendChild(mk('🗑', () => deleteHabit(h.id)));

        pageContainer.appendChild(div);
      });
    }

    function toggleHabit(id){ toggleHabitForDate(id, dayKey(new Date()), false); }

    function toggleHabitForDate(id, dateKey, fromModal){
      if(!Array.isArray(db.habitHistory[id])) db.habitHistory[id] = [];
      if(db.habitHistory[id].includes(dateKey)) db.habitHistory[id] = db.habitHistory[id].filter(x => x !== dateKey);
      else db.habitHistory[id].push(dateKey);
      saveDB();
      if(fromModal) renderHabitDetailModal();
      if(currentPage === 'habits') renderCurrentPage();
    }

    /* FIX: while döngüsünde üst sınır yoktu; bozuk veri sonsuz döngüye sokabiliyordu */
    function calculateStreak(history){
      if(!Array.isArray(history) || history.length === 0) return 0;
      const set = new Set(history);
      const check = new Date();
      if(!set.has(dayKey(check))) check.setDate(check.getDate() - 1);  // bugün boşsa seri henüz kırılmadı
      let streak = 0, guard = 0;
      while(set.has(dayKey(check)) && guard++ < 3650){
        streak++;
        check.setDate(check.getDate() - 1);
      }
      return streak;
    }

      selectedHabitMonth = new Date();

    function renderHabitDetailModal(){
